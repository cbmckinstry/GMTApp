# Builds the app on every system and gathers the builds into one folder, GMTCrewManager-<version>, with Mac,
# Windows and Linux subfolders. Pushing a tag like v1.2.0 publishes that folder as one zip on a GitHub Release
# in the public download repository;
# "Run workflow" on the Actions tab only builds (the folder is attached to the run).
name: Build and release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest       # Apple Silicon
          - os: macos-15-intel     # Intel Macs
          - os: windows-latest
          - os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    env:
      APP_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
    steps:
      # core/ is a git submodule. If the core repository is private, add a token that can read it as the
      # CORE_TOKEN secret; for a public core repository the default token is enough.
      - uses: actions/checkout@v4
        with:
          submodules: true
          token: ${{ secrets.CORE_TOKEN || github.token }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install -r requirements.txt

      # On Linux pywebview draws the window with Qt.
      - name: Linux window libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0
          python -m pip install "pywebview[qt]"

      - name: Build
        run: python packaging/build.py

      # Artifacts lose file permissions and the links inside a Mac app, so each build travels as a tar file.
      - name: Pack for transfer
        run: tar -czf ${{ matrix.os }}.tgz -C dist .

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}
          path: ${{ matrix.os }}.tgz

  gather:
    needs: build
    if: ${{ !cancelled() }}
    runs-on: macos-latest      # ditto zips Mac apps without breaking them
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: transfer
          merge-multiple: true

      - name: Put the builds in one folder and zip it
        id: zip
        run: |
          mkdir dist
          for f in transfer/*.tgz; do tar -xzf "$f" -C dist; done
          folder=$(cd dist && ls -d GMTCrewManager-*/ | head -1)
          folder=${folder%/}
          xattr -cr dist      # stray file metadata would make the Mac apps fail macOS's signature check
          ditto -c -k --norsrc --noextattr --keepParent "dist/$folder" "dist/$folder.zip"
          echo "file=dist/$folder.zip" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: all-systems
          path: ${{ steps.zip.outputs.file }}

      # Releases go to the public download repository, so the source here can stay private. RELEASE_TOKEN is a
      # token that can write to it (fine-grained: Contents read and write on that repository).
      - if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          repository: cbmckinstry/GMTDownload
          token: ${{ secrets.RELEASE_TOKEN }}
          files: ${{ steps.zip.outputs.file }}
